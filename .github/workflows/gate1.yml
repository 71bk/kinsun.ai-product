name: Gate 1 Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+asyncpg://kinsun:kinsun_local_dev@localhost:5432/kinsun
  TEST_DATABASE_URL: postgresql+asyncpg://kinsun:kinsun_local_dev@localhost:5432/kinsun_test
  APP_ENV: development
  FAKE_AUTH_ENABLED: "false"
  AWS_EC2_METADATA_DISABLED: "true"
  # Synthetic key for the disposable CI gateway only. Deployments must
  # inject an environment-specific secret and never reuse service identity.
  TTS_CLIENT_IP_HASH_SECRET: synthetic-ci-tts-client-ip-hash-secret-material


jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      core-fast: ${{ steps.plan.outputs.core-fast }}
      core-db: ${{ steps.plan.outputs.core-db }}
      agent-quality: ${{ steps.plan.outputs.agent-quality }}
      speech-quality: ${{ steps.plan.outputs.speech-quality }}
      rag-quality: ${{ steps.plan.outputs.rag-quality }}
      contracts: ${{ steps.plan.outputs.contracts }}
      cross-service: ${{ steps.plan.outputs.cross-service }}
      frontend-quality: ${{ steps.plan.outputs.frontend-quality }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Local merge-base diff avoids truncated PR files APIs and includes fork heads.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.25"
          enable-cache: false
      - name: CI instrumentation regression tests
        run: python scripts/ci/telemetry.py run --id ci-tools -- uv run --no-project --with "pyyaml==6.0.2" python -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: CI policy lint
        run: python scripts/ci/telemetry.py run --id ci-policy-lint -- uv run --no-project --with "ruff==0.8.6" ruff check scripts/ci
      - name: CI policy format
        run: python scripts/ci/telemetry.py run --id ci-policy-format -- uv run --no-project --with "ruff==0.8.6" ruff format --check scripts/ci
      - name: Determine affected workers and check diff
        id: plan
        run: python scripts/ci/telemetry.py run --id impact -- python scripts/ci/impact.py --out "${{ runner.temp }}/ci-metrics/impact-plan.json"
      - name: Summarize CI metrics
        if: always()
        run: python scripts/ci/telemetry.py summary
      - name: Upload bounded CI metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          if-no-files-found: error
          retention-days: 30

  core-fast:
    needs: changes
    if: needs.changes.outputs.core-fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        id: uv
        with:
          version: "0.11.25"
          enable-cache: true
          cache-suffix: core-fast
          cache-dependency-glob: |
            services/core-api/pyproject.toml
            services/core-api/uv.lock

      - name: Install Core environment
        run: python scripts/ci/telemetry.py run --id install-core -- uv sync --frozen --project services/core-api --extra test --extra dev

      - name: Core lint
        run: python scripts/ci/telemetry.py run --id core-lint -- uv run --frozen --project services/core-api ruff check services/core-api scripts/verify_gate1_cross_service.py scripts/rag/project_postgres.py scripts/ci

      - name: Core format
        run: python scripts/ci/telemetry.py run --id core-format -- uv run --frozen --project services/core-api ruff format --check services/core-api scripts/verify_gate1_cross_service.py scripts/rag/project_postgres.py scripts/ci

      - name: RAG projection dry-run
        run: python scripts/ci/telemetry.py run --id core-rag-dry-run -- uv run --frozen --project services/core-api python scripts/rag/project_postgres.py dry-run

      - name: Core unit tests
        run: python scripts/ci/telemetry.py run --id core-unit --test-format pytest -- uv run --frozen --project services/core-api pytest services/core-api/tests/unit

      - name: Summarize CI metrics
        if: always()
        env:
          CI_UV_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
        run: python scripts/ci/telemetry.py summary

      - name: Upload bounded CI metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          if-no-files-found: error
          retention-days: 30

  core-db:
    needs: changes
    if: needs.changes.outputs.core-db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_DB: kinsun
          POSTGRES_USER: kinsun
          POSTGRES_PASSWORD: kinsun_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kinsun -d kinsun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        id: uv
        with:
          version: "0.11.25"
          enable-cache: true
          cache-suffix: core-db
          cache-dependency-glob: |
            services/core-api/pyproject.toml
            services/core-api/uv.lock

      - name: Install Core environment
        run: python scripts/ci/telemetry.py run --id install-core -- uv sync --frozen --project services/core-api --extra test --extra dev

      - name: Create disposable integration database
        run: >-
          python scripts/ci/telemetry.py run --id database-create -- uv run --frozen --project services/core-api python -c
          "import psycopg;
          connection = psycopg.connect('postgresql://kinsun:kinsun_local_dev@localhost:5432/postgres', autocommit=True);
          connection.execute('CREATE DATABASE kinsun_test');
          connection.close()"

      # Keep destructive migration and request integration in separate, ordered processes.
      - name: Core migration lifecycle
        run: python scripts/ci/telemetry.py run --id core-migrations --test-format pytest -- uv run --frozen --project services/core-api pytest services/core-api/tests/integration/test_migrations.py

      - name: Core PostgreSQL integration
        run: python scripts/ci/telemetry.py run --id core-integration --test-format pytest -- uv run --frozen --project services/core-api pytest services/core-api/tests/integration --ignore=services/core-api/tests/integration/test_migrations.py

      - name: Core live contracts
        run: python scripts/ci/telemetry.py run --id contracts-core -- uv run --frozen --project services/core-api --with "pyyaml==6.0.2" --with "jsonschema==4.23.0" --with "referencing==0.35.1" python scripts/verify_contract_live.py contracts

      - name: Summarize CI metrics
        if: always()
        env:
          CI_UV_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
        run: python scripts/ci/telemetry.py summary

      - name: Upload bounded CI metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          if-no-files-found: error
          retention-days: 30

  agent-quality:
    needs: changes
    if: needs.changes.outputs.agent-quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        id: uv
        with:
          version: "0.11.25"
          enable-cache: true
          cache-suffix: agent-quality
          cache-dependency-glob: |
            services/agent-runtime/pyproject.toml
            services/agent-runtime/uv.lock

      - name: Install Agent environment
        run: python scripts/ci/telemetry.py run --id install-agent -- uv sync --frozen --project services/agent-runtime --extra test --extra dev

      - name: Agent lint
        run: python scripts/ci/telemetry.py run --id agent-lint -- uv run --frozen --project services/agent-runtime ruff check services/agent-runtime

      - name: Agent format
        run: python scripts/ci/telemetry.py run --id agent-format -- uv run --frozen --project services/agent-runtime ruff format --check services/agent-runtime

      - name: Agent tests
        run: python scripts/ci/telemetry.py run --id agent-tests --test-format pytest -- uv run --frozen --project services/agent-runtime pytest services/agent-runtime/tests

      - name: Summarize CI metrics
        if: always()
        env:
          CI_UV_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
        run: python scripts/ci/telemetry.py summary

      - name: Upload bounded CI metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          if-no-files-found: error
          retention-days: 30

  speech-quality:
    needs: changes
    if: needs.changes.outputs.speech-quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        id: uv
        with:
          version: "0.11.25"
          enable-cache: true
          cache-suffix: speech-quality
          cache-dependency-glob: |
            services/speech-gateway/pyproject.toml
            services/speech-gateway/uv.lock

      - name: Install Speech environment
        run: python scripts/ci/telemetry.py run --id install-speech -- uv sync --frozen --project services/speech-gateway --extra test --extra dev

      - name: Speech lint
        run: python scripts/ci/telemetry.py run --id speech-lint -- uv run --frozen --project services/speech-gateway ruff check services/speech-gateway

      - name: Speech format
        run: python scripts/ci/telemetry.py run --id speech-format -- uv run --frozen --project services/speech-gateway ruff format --check services/speech-gateway

      - name: Speech tests
        run: python scripts/ci/telemetry.py run --id speech-tests --test-format pytest -- uv run --frozen --project services/speech-gateway pytest services/speech-gateway/tests

      - name: Summarize CI metrics
        if: always()
        env:
          CI_UV_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
        run: python scripts/ci/telemetry.py summary

      - name: Upload bounded CI metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          if-no-files-found: error
          retention-days: 30

  rag-quality:
    needs: changes
    if: needs.changes.outputs.rag-quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        id: uv
        with:
          version: "0.11.25"
          enable-cache: true
          cache-suffix: rag-quality
          cache-dependency-glob: |
            services/rag-ingestion/pyproject.toml
            services/rag-ingestion/uv.lock

      - name: Install RAG environment
        run: python scripts/ci/telemetry.py run --id install-rag -- uv sync --frozen --project services/rag-ingestion --extra test --extra dev

      - name: RAG lint
        run: python scripts/ci/telemetry.py run --id rag-lint -- uv run --frozen --project services/rag-ingestion ruff check services/rag-ingestion

      - name: RAG format
        run: python scripts/ci/telemetry.py run --id rag-format -- uv run --frozen --project services/rag-ingestion ruff format --check services/rag-ingestion

      - name: RAG policy audit
        run: python scripts/ci/telemetry.py run --id rag-policy-audit -- uv run --frozen --project services/rag-ingestion python scripts/rag/validate_source_family_policy_audit_v8.py

      - name: RAG tests
        run: python scripts/ci/telemetry.py run --id rag-tests --test-format pytest -- uv run --frozen --project services/rag-ingestion pytest services/rag-ingestion/tests

      - name: Summarize CI metrics
        if: always()
        env:
          CI_UV_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
        run: python scripts/ci/telemetry.py summary

      - name: Upload bounded CI metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          if-no-files-found: error
          retention-days: 30

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        id: uv
        with:
          version: "0.11.25"
          enable-cache: true
          cache-suffix: contracts
          cache-dependency-glob: |
            services/core-api/pyproject.toml
            services/core-api/uv.lock
            services/agent-runtime/pyproject.toml
            services/agent-runtime/uv.lock

      - name: Install Core environment
        run: python scripts/ci/telemetry.py run --id install-core -- uv sync --frozen --project services/core-api --extra test --extra dev

      - name: Install Agent environment
        run: python scripts/ci/telemetry.py run --id install-agent -- uv sync --frozen --project services/agent-runtime --extra test --extra dev

      - name: Static contracts
        run: python scripts/ci/telemetry.py run --id contracts-static -- uv run --frozen --project services/core-api --with "pyyaml==6.0.2" --with "jsonschema==4.23.0" --with "referencing==0.35.1" python scripts/validate_contracts.py contracts

      - name: Agent live contracts
        run: python scripts/ci/telemetry.py run --id contracts-agent -- uv run --frozen --project services/agent-runtime --with "pyyaml==6.0.2" --with "jsonschema==4.23.0" --with "referencing==0.35.1" python scripts/verify_agent_contract_live.py contracts

      - name: Summarize CI metrics
        if: always()
        env:
          CI_UV_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
        run: python scripts/ci/telemetry.py summary

      - name: Upload bounded CI metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          if-no-files-found: error
          retention-days: 30

  cross-service:
    needs: changes
    if: needs.changes.outputs.cross-service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        id: uv
        with:
          version: "0.11.25"
          enable-cache: true
          cache-suffix: cross-service
          cache-dependency-glob: |
            services/core-api/pyproject.toml
            services/core-api/uv.lock
            services/agent-runtime/pyproject.toml
            services/agent-runtime/uv.lock

      - name: Install Core environment
        run: python scripts/ci/telemetry.py run --id install-core -- uv sync --frozen --project services/core-api --extra test --extra dev

      - name: Install Agent environment
        run: python scripts/ci/telemetry.py run --id install-agent -- uv sync --frozen --project services/agent-runtime --extra test --extra dev

      - name: Five-run synthetic Core-to-Agent evidence
        run: >-
          python scripts/ci/telemetry.py run --id cross-service -- uv run --frozen --project services/core-api python
          scripts/verify_gate1_cross_service.py
          --evidence-out /tmp/gate1-synthetic-five-run.json

      - name: Upload bounded Gate 1 evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gate1-synthetic-evidence-${{ github.run_attempt }}
          path: /tmp/gate1-synthetic-five-run.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize CI metrics
        if: always()
        env:
          CI_UV_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
        run: python scripts/ci/telemetry.py summary

      - name: Upload bounded CI metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          if-no-files-found: error
          retention-days: 30

  frontend-quality:
    needs: changes
    if: needs.changes.outputs.frontend-quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Frontend dependencies
        run: python scripts/ci/telemetry.py run --id frontend-install -- npm ci

      - name: Frontend typecheck
        run: python scripts/ci/telemetry.py run --id frontend-typecheck -- npm run typecheck --workspace @elderly-care/frontend

      - name: Frontend unit tests
        run: python scripts/ci/telemetry.py run --id frontend-tests --test-format vitest -- npm run test --workspace @elderly-care/frontend -- --run

      - name: Frontend lint
        run: python scripts/ci/telemetry.py run --id frontend-lint -- npm run lint

      - name: Frontend production build
        run: python scripts/ci/telemetry.py run --id frontend-build -- npm run build --workspace @elderly-care/frontend

      - name: Summarize CI metrics
        if: always()
        env:
          CI_NPM_CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
        run: python scripts/ci/telemetry.py summary

      - name: Upload bounded CI metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          if-no-files-found: error
          retention-days: 30

  synthetic-gate1:
    name: synthetic-gate1
    if: always()
    needs: [changes, core-fast, core-db, agent-quality, speech-quality, rag-quality, contracts, cross-service, frontend-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download worker metrics
        if: always()
        uses: actions/download-artifact@v4
        with:
          # Include previous attempts: rerun-failed-jobs reuses successful worker jobs.
          pattern: ci-metrics-*
          path: ${{ runner.temp }}/worker-metrics
      - name: Require every worker and summarize metrics
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python scripts/ci/gate.py
          --metrics "${{ runner.temp }}/worker-metrics"
          --out "${{ runner.temp }}/gate1-aggregate/summary.json"
      - name: Upload aggregate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate1-aggregate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate1-aggregate/
          if-no-files-found: error
          retention-days: 30
