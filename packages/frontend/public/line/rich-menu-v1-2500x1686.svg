  <g class="font" transform="translate(138 120)">
    <rect width="360" height="102" rx="51" fill="#FFFFFF" opacity="0.16"/>
    <circle cx="57" cy="51" r="31" fill="#67E8F9"/>
    <path d="M43 55c18-4 25-14 29-31 9 15 7 30-8 41-9 6-18 4-21-10Z" fill="#047857"/>
    <text x="105" y="68" fill="#FFFFFF" font-size="47" font-weight="700" letter-spacing="1">kinsun.ai</text>
  </g>

