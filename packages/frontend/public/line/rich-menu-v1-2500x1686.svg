  <g filter="url(#card-shadow)">
    <rect x="1250" y="612" width="1200" height="462" rx="64" fill="#F5FFFA"/>
  </g>
  <circle cx="1435" cy="843" r="128" fill="url(#family-icon-bg)"/>
  <g transform="translate(1435 843)">
    <circle cx="0" cy="-48" r="45" fill="#047857"/>
    <circle cx="-78" cy="-17" r="34" fill="#059669" opacity="0.82"/>
    <circle cx="78" cy="-17" r="34" fill="#059669" opacity="0.82"/>
    <path d="M-72 94c0-71 31-111 72-111s72 40 72 111" fill="#059669"/>
    <path d="M-136 89c2-48 23-77 58-77 23 0 39 13 49 37-8 17-13 38-13 63h-94Z" fill="#34D399"/>
    <path d="M136 89c-2-48-23-77-58-77-23 0-39 13-49 37 8 17 13 38 13 63h94Z" fill="#34D399"/>
  </g>
  <g class="font">
    <text x="1625" y="797" class="card-title">家人共享</text>
    <text x="1625" y="877" class="card-body">邀請你信任的家人</text>
    <g transform="translate(1625 919)">
      <rect width="300" height="70" rx="35" fill="#DDF8EC"/>
      <path d="M24 36 35 47 55 25" fill="none" stroke="#047857" stroke-linecap="round" stroke-linejoin="round" stroke-width="8"/>
      <text x="74" y="49" fill="#047857" font-size="34" font-weight="700">一次性邀請碼</text>
    </g>
  </g>
  <circle cx="2322" cy="843" r="55" fill="#059669"/>
  <path d="M2302 843h41M2325 822l21 21-21 21" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="11"/>

  <!-- Consent card: bounds x=1200..2500, y=1124..1686 -->
  <g filter="url(#card-shadow)">
    <rect x="1250" y="1174" width="1200" height="462" rx="64" fill="#FFFFFF"/>
  </g>
  <circle cx="1435" cy="1405" r="128" fill="url(#privacy-icon-bg)"/>
  <g transform="translate(1435 1405)">
    <path d="M0-104 88-70v77c0 74-38 126-88 151-50-25-88-77-88-151v-77Z" fill="#0891B2"/>
    <path d="m-40 10 30 31 58-67" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="22"/>
  </g>
  <g class="font">
    <text x="1625" y="1359" class="card-title">隱私設定</text>
    <text x="1625" y="1439" class="card-body">分享範圍由你決定</text>
    <g transform="translate(1625 1481)">
      <rect width="300" height="70" rx="35" fill="#ECFEFF"/>
      <path d="M28 28v-7c0-14 9-23 22-23s22 9 22 23v7" fill="none" stroke="#0E7490" stroke-linecap="round" stroke-width="7" transform="scale(.72) translate(5 14)"/>
      <rect x="24" y="26" width="38" height="31" rx="7" fill="#0E7490"/>
      <text x="78" y="49" fill="#0E7490" font-size="34" font-weight="700">隨時可以調整</text>
    </g>
  </g>
  <circle cx="2322" cy="1405" r="55" fill="#0E7490"/>
  <path d="M2302 1405h41M2325 1384l21 21-21 21" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="11"/>

  <!-- Subtle tap-region separators; visual only -->
  <path d="M1200 50v1586" stroke="#164E63" stroke-dasharray="2 18" stroke-linecap="round" stroke-width="4" opacity="0.08"/>
</svg>
