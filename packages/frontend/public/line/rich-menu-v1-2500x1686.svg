      <path d="M311 94h-60M281 64v60" stroke="#6EE7B7" stroke-linecap="round" stroke-width="15"/>
      <circle cx="-300" cy="180" r="12" fill="#FFFFFF"/>
      <circle cx="299" cy="-215" r="13" fill="#FFFFFF"/>
    </g>
