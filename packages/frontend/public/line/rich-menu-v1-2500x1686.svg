<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1686" viewBox="0 0 2500 1686" role="img" aria-labelledby="title description">
  <title id="title">kinsun.ai LINE 陪伴選單</title>
  <description id="description">長者友善的四功能選單：開始陪伴、連結帳號、家人共享與隱私設定。</description>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ECFEFF"/>
      <stop offset="0.52" stop-color="#F4FFFD"/>
      <stop offset="1" stop-color="#E8FAF4"/>
    </linearGradient>
    <linearGradient id="hero-bg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#0891B2"/>
      <stop offset="0.55" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="orb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFFAFE"/>
    </linearGradient>
    <linearGradient id="link-icon-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CFFAFE"/>
      <stop offset="1" stop-color="#A5F3FC"/>
    </linearGradient>
    <linearGradient id="family-icon-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDF8EC"/>
      <stop offset="1" stop-color="#B9EDD6"/>
    </linearGradient>
    <linearGradient id="privacy-icon-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9F9FC"/>
      <stop offset="1" stop-color="#CFFAFE"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#164E63" flood-opacity="0.14"/>
    </filter>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#164E63" flood-opacity="0.17"/>
    </filter>
    <pattern id="hero-dots" width="76" height="76" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="5" fill="#FFFFFF" opacity="0.12"/>
    </pattern>
    <style>
      .font { font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; }
      .title { font-weight: 700; letter-spacing: 1px; }
      .body { font-weight: 500; }
      .muted { fill: #64748B; }
      .card-title { fill: #164E63; font-size: 92px; font-weight: 700; }
      .card-body { fill: #64748B; font-size: 45px; font-weight: 500; }
      .icon-stroke { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 24; }
    </style>
  </defs>

  <!-- Calm background -->
  <rect width="2500" height="1686" fill="url(#page-bg)"/>
  <circle cx="2250" cy="-100" r="430" fill="#A5F3FC" opacity="0.28"/>
  <circle cx="1180" cy="1760" r="460" fill="#A7E8CF" opacity="0.26"/>
  <path d="M1810 0C2010 220 2310 170 2500 55V0Z" fill="#FFFFFF" opacity="0.42"/>
  <path d="M0 1450C260 1350 400 1430 590 1686H0Z" fill="#CFFAFE" opacity="0.45"/>

  <!-- Main companion action: bounds x=0..1200, y=0..1686 -->
  <g filter="url(#card-shadow)">
    <rect x="50" y="50" width="1100" height="1586" rx="78" fill="url(#hero-bg)"/>
  </g>
  <rect x="50" y="50" width="1100" height="1586" rx="78" fill="url(#hero-dots)"/>
  <circle cx="118" cy="150" r="122" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="1090" cy="1320" r="310" fill="#FFFFFF" opacity="0.07"/>
  <path d="M55 1320C310 1190 690 1340 1150 1100V1636H50Z" fill="#FFFFFF" opacity="0.08"/>

