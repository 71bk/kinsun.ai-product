    <path d="M50-235C75-295 125-320 177-316C163-259 127-222 65-214Z" fill="#6EE7B7" stroke="#FFFFFF" stroke-width="12"/>
    <circle cx="-78" cy="-22" r="24" fill="#164E63"/>
    <circle cx="83" cy="-22" r="24" fill="#164E63"/>
    <circle cx="-137" cy="43" r="31" fill="#FCA5A5" opacity="0.46"/>
    <circle cx="142" cy="43" r="31" fill="#FCA5A5" opacity="0.46"/>
    <path d="M-76 74C-35 124 36 126 82 70" fill="none" stroke="#0E7490" stroke-linecap="round" stroke-width="22"/>
    <path d="M-20 198L-72 268L45 224Z" fill="#CFFAFE" stroke="#FFFFFF" stroke-linejoin="round" stroke-width="16"/>
    <g transform="translate(184 -144)">
      <circle r="78" fill="#059669" stroke="#FFFFFF" stroke-width="12"/>
      <path d="M-30 3L-7 26L36-25" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
    </g>
