  <g class="font" text-anchor="middle">
    <text x="600" y="895" fill="#D8FAFF" font-size="48" font-weight="700" letter-spacing="8">陪伴就在這裡</text>
    <text x="600" y="1042" fill="#FFFFFF" font-size="142" font-weight="700" letter-spacing="2">開始陪伴</text>
    <text x="600" y="1132" fill="#D8FAFF" font-size="51" font-weight="500">想聊什麼，都可以告訴我</text>
  </g>

  <g class="font" transform="translate(150 1215)">
    <rect width="900" height="174" rx="58" fill="#FFFFFF"/>
    <circle cx="96" cy="87" r="53" fill="#ECFEFF"/>
    <path d="M72 73h34c22 0 38 14 38 34s-16 34-38 34H88l-23 18 7-30c-10-6-16-17-16-30 0-10 6-20 16-26Z" fill="#0891B2" transform="translate(0 -14) scale(.65) translate(62 58)"/>
    <text x="176" y="106" fill="#164E63" font-size="55" font-weight="700">輕觸後直接開始對話</text>
    <circle cx="817" cy="87" r="48" fill="#059669"/>
    <path d="M798 87h36M820 68l19 19-19 19" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="10"/>
  </g>

  <g class="font" transform="translate(164 1490)" opacity="0.9">
    <path d="M22 0 44 9v18c0 18-10 31-22 38C10 58 0 45 0 27V9Z" fill="none" stroke="#D8FAFF" stroke-linejoin="round" stroke-width="7"/>
    <path d="m12 28 8 8 14-17" fill="none" stroke="#D8FAFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/>
    <text x="70" y="43" fill="#D8FAFF" font-size="35" font-weight="500">安心陪伴・非緊急醫療管道</text>
  </g>

  <!-- Account link card: bounds x=1200..2500, y=0..562 -->
  <g filter="url(#card-shadow)">
    <rect x="1250" y="50" width="1200" height="462" rx="64" fill="#FFFFFF"/>
  </g>
  <circle cx="1435" cy="281" r="128" fill="url(#link-icon-bg)"/>
  <g class="icon-stroke" stroke="#0E7490" transform="translate(1435 281) rotate(-38)">
    <rect x="-90" y="-45" width="118" height="90" rx="45"/>
    <rect x="-28" y="-45" width="118" height="90" rx="45"/>
    <path d="M-25 0h50"/>
  </g>
  <g class="font">
    <text x="1625" y="235" class="card-title">連結帳號</text>
    <text x="1625" y="315" class="card-body">安全綁定 LINE 身分</text>
    <g transform="translate(1625 357)">
      <rect width="282" height="70" rx="35" fill="#ECFEFF"/>
      <circle cx="36" cy="35" r="15" fill="#0891B2"/>
      <text x="68" y="49" fill="#0E7490" font-size="34" font-weight="700">身分受保護</text>
    </g>
  </g>
  <circle cx="2322" cy="281" r="55" fill="#0891B2"/>
  <path d="M2302 281h41M2325 260l21 21-21 21" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="11"/>

