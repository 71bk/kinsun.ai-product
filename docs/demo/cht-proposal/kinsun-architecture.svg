<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1152" width="720" height="1152" role="img"
     aria-label="Kinsun 系統分層架構：使用者端經連線層到 PWA/BFF，再到唯一可寫入正式紀錄的 Core API；Agent Runtime 只回傳提案、Speech Gateway 只回傳辨識結果，皆由 Core 重新驗證後寫入 PostgreSQL。"
     font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
  <defs>
    <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#334155"/>
    </marker>
    <marker id="aem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="asm" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="1152" fill="#FFFFFF"/>

  <!-- ===== A. 使用者與機構端 ===== -->
  <g stroke="#94A3B8" stroke-width="1.2" fill="#FFFFFF">
    <rect x="40"  y="24" width="150" height="80" rx="6"/>
    <rect x="210" y="24" width="150" height="80" rx="6"/>
    <rect x="380" y="24" width="150" height="80" rx="6"/>
    <rect x="550" y="24" width="130" height="80" rx="6" stroke-dasharray="6 4" fill="#F8FAFC"/>
  </g>
  <g fill="#0F172A" font-size="15" font-weight="700">
    <text x="115" y="47" text-anchor="middle">長者</text>
    <text x="285" y="47" text-anchor="middle">照護者</text>
    <text x="455" y="47" text-anchor="middle">家屬</text>
  </g>
  <g fill="#334155" font-size="12" text-anchor="middle">
    <text x="115" y="69">機構平板</text>
    <text x="115" y="88">按鍵錄音／文字・聽回覆</text>
    <text x="285" y="69">工作台（瀏覽器）</text>
    <text x="285" y="88">覆核・採用・追蹤待辦</text>
    <text x="455" y="69">手機／瀏覽器</text>
    <text x="455" y="88">只讀已發布報表</text>
  </g>
  <g fill="#64748B" font-size="12" text-anchor="middle">
    <text x="615" y="47" font-weight="700">LINE／Email（規劃）</text>
    <text x="615" y="69">最小通知＋安全連結</text>
    <text x="615" y="88">正式內容只在報表頁</text>
  </g>
  <!-- LINE → 家屬 -->
  <line x1="550" y1="64" x2="532" y2="64" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#aem)"/>

  <!-- ===== B. 連線層（規劃） ===== -->
  <rect x="40" y="124" width="640" height="46" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="668" y="143" font-size="13" font-weight="700" fill="#64748B" text-anchor="end">中華電信連線層（規劃・尚未整合）</text>
  <text x="668" y="161" font-size="12" fill="#64748B" text-anchor="end">機構固網寬頻主要接取・5G 行動備援（人工切換）</text>

  <!-- A → C 使用者操作（穿過連線層） -->
  <g stroke="#334155" stroke-width="1.5" marker-start="url(#as)" marker-end="url(#ae)">
    <line x1="130" y1="104" x2="130" y2="200"/>
    <line x1="285" y1="104" x2="285" y2="200"/>
    <line x1="440" y1="104" x2="440" y2="200"/>
  </g>
  <g fill="#334155" font-size="12">
    <text x="137" y="192">對話</text>
    <text x="292" y="192">覆核與待辦</text>
    <text x="447" y="192">讀取報表</text>
  </g>

  <!-- ===== C. 使用者介面 + BFF ===== -->
  <rect x="40" y="200" width="640" height="80" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/>
  <text x="56" y="224" font-size="16" font-weight="700" fill="#0F172A">使用者介面＋BFF ｜ Next.js／React 單一多角色 PWA</text>
  <g fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1">
    <rect x="60"  y="236" width="140" height="32" rx="5"/>
    <rect x="215" y="236" width="140" height="32" rx="5"/>
    <rect x="370" y="236" width="140" height="32" rx="5"/>
  </g>
  <g fill="#0F172A" font-size="12.5" text-anchor="middle">
    <text x="130" y="257">/elder 長者陪伴頁</text>
    <text x="285" y="257">/staff 照護者工作台</text>
    <text x="440" y="257">/family 家屬報表頁</text>
  </g>
  <g fill="#64748B" font-size="11">
    <text x="526" y="250">Token 不進瀏覽器，只持</text>
    <text x="526" y="265">HttpOnly Session Cookie</text>
  </g>

  <!-- C → D -->
  <line x1="360" y1="280" x2="360" y2="330" stroke="#334155" stroke-width="1.5" marker-start="url(#as)" marker-end="url(#ae)"/>
  <text x="370" y="310" font-size="12" fill="#334155">同源 BFF 轉發（header allowlist；不轉發 cookie／token）</text>

  <!-- ===== D. 核心資料服務 Core API ===== -->
  <rect x="40" y="330" width="640" height="386" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="56" y="354" font-size="16" font-weight="700" fill="#0F172A">核心資料服務 Core API ｜ Python／FastAPI</text>
  <text x="664" y="354" font-size="12.5" font-weight="700" fill="#1D4ED8" text-anchor="end">唯一正式狀態權威</text>

  <!-- chips: 2 cols × 5 rows -->
  <g fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1">
    <rect x="56"  y="368" width="296" height="40" rx="5"/>
    <rect x="368" y="368" width="296" height="40" rx="5"/>
    <rect x="56"  y="416" width="296" height="40" rx="5"/>
    <rect x="368" y="416" width="296" height="40" rx="5"/>
    <rect x="56"  y="464" width="296" height="40" rx="5"/>
    <rect x="368" y="464" width="296" height="40" rx="5"/>
    <rect x="56"  y="512" width="296" height="40" rx="5"/>
    <rect x="368" y="512" width="296" height="40" rx="5"/>
    <rect x="56"  y="560" width="296" height="40" rx="5"/>
    <rect x="368" y="560" width="296" height="40" rx="5" stroke="#94A3B8" stroke-dasharray="6 4" fill="#F8FAFC"/>
  </g>
  <g font-size="13" font-weight="700" fill="#0F172A">
    <text x="66"  y="384">身分與 Session</text>
    <text x="378" y="384">用途同意 Consent</text>
    <text x="66"  y="432">授權政策 RBAC＋ABAC</text>
    <text x="378" y="432">派案 Assignment</text>
    <text x="66"  y="480">照護事件 Care Event</text>
    <text x="378" y="480">關懷行動 Care Action</text>
    <text x="66"  y="528">每日摘要 Daily Summary</text>
    <text x="378" y="528">家屬報表 Family Report</text>
    <text x="66"  y="576">語音票券／ASR 品質閘</text>
    <text x="378" y="576" fill="#64748B">長期記憶 Memory（風險分級・待整合）</text>
  </g>
  <g font-size="11.5" fill="#475569">
    <text x="66"  y="400">Email＋密碼；Google／LINE OIDC</text>
    <text x="378" y="400">陪伴・記憶・家屬分享 分開檢查</text>
    <text x="66"  y="448">機構／長者範圍・預設拒絕</text>
    <text x="378" y="448">照護者對長者的授權依派案與時窗</text>
    <text x="66"  y="496">候選 → <tspan fill="#B45309" font-weight="700">照護者確認</tspan> → 已驗證（版本）</text>
    <text x="378" y="496">候選 → <tspan fill="#B45309" font-weight="700">採用</tspan> → 待辦狀態追蹤</text>
    <text x="66"  y="544">取自已驗證事件；來源變更即標過期</text>
    <text x="378" y="544">草稿不可見；發布後依分享範圍</text>
    <text x="66"  y="592">低信心即要求確認，不假裝辨識成功</text>
    <text x="378" y="592" fill="#64748B">低 嚴格自動・中 長者確認・高 不存</text>
  </g>

  <!-- Command Gate -->
  <rect x="56" y="610" width="608" height="38" rx="5" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="66" y="626" font-size="12" fill="#78350F"><tspan font-weight="700">命令閘門 Command Gate：</tspan>每次讀寫重驗 機構・長者・派案・用途同意・狀態；不信任 Client／AI 傳入的範圍</text>
  <text x="66" y="642" font-size="12" fill="#78350F">AI 提案須通過契約＋政策檢查、再經照護者確認，才成為正式紀錄與待辦</text>

  <!-- PostgreSQL bar -->
  <rect x="56" y="658" width="608" height="46" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <g stroke="#2563EB" stroke-width="1.2" fill="#DBEAFE">
    <path d="M70,672 v18 a14,5 0 0 0 28,0 v-18"/>
    <ellipse cx="84" cy="672" rx="14" ry="5"/>
  </g>
  <text x="112" y="675" font-size="13.5" font-weight="700" fill="#0F172A">PostgreSQL <tspan font-size="11.5" font-weight="400" fill="#475569">Supabase・schema 由 Alembic migration 管理</tspan></text>
  <text x="112" y="694" font-size="12" fill="#334155">正式紀錄 ＋ Transactional Outbox 同一交易寫入；不對投影／索引做 dual write</text>

  <!-- ===== D ↔ E 之間的呼叫 ===== -->
  <!-- Speech ↔ Core -->
  <line x1="100" y1="800" x2="100" y2="716" stroke="#334155" stroke-width="1.5" marker-end="url(#ae)"/>
  <line x1="124" y1="716" x2="124" y2="800" stroke="#334155" stroke-width="1.5" marker-end="url(#ae)"/>
  <g font-size="12" fill="#334155">
    <text x="136" y="744">↑ consume Voice Ticket・送 ASR Final</text>
    <text x="136" y="760">↓ 品質閘判定・TTS 播放授權</text>
    <text x="136" y="776" font-size="11" fill="#64748B">短效、請求綁定、單次使用的服務憑證</text>
  </g>
  <!-- Core ↔ Agent -->
  <line x1="420" y1="716" x2="420" y2="800" stroke="#334155" stroke-width="1.5" marker-end="url(#ae)"/>
  <line x1="444" y1="800" x2="444" y2="716" stroke="#334155" stroke-width="1.5" marker-end="url(#ae)"/>
  <g font-size="12" fill="#334155">
    <text x="456" y="744">↓ requested_outputs＋受控 context</text>
    <text x="456" y="760">↑ 回覆＋事件／記憶提案（不可信）</text>
    <text x="456" y="776" font-size="11" fill="#64748B">context：政策→授權→同意→本輪→已確認記憶</text>
  </g>

  <!-- ===== E. 語音服務 / AI 執行服務 ===== -->
  <rect x="40" y="800" width="310" height="210" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/>
  <text x="56" y="824" font-size="15" font-weight="700" fill="#0F172A">語音服務 Speech Gateway</text>
  <g fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1">
    <rect x="56" y="838" width="278" height="40" rx="5"/>
    <rect x="56" y="886" width="278" height="40" rx="5"/>
    <rect x="56" y="934" width="278" height="40" rx="5"/>
  </g>
  <g font-size="13" font-weight="700" fill="#0F172A">
    <text x="66" y="854">ASR 語音 → 文字</text>
    <text x="66" y="902">TTS 文字 → 語音</text>
    <text x="66" y="950">伺服器決定供應商路由</text>
  </g>
  <g font-size="11.5" fill="#475569">
    <text x="66" y="870">華／英 Deepgram Nova-3・台／客 SageMaker</text>
    <text x="66" y="918">華／英 Azure AI Speech・台／客 SageMaker</text>
    <text x="66" y="966">瀏覽器不可指定；日誌無音訊／逐字稿</text>
  </g>
  <text x="56" y="996" font-size="11" fill="#64748B">轉接器已測試；端到端流程待驗收</text>
  <text x="334" y="996" font-size="11" fill="#64748B" text-anchor="end">Python／FastAPI</text>

  <rect x="370" y="800" width="310" height="210" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/>
  <text x="386" y="824" font-size="15" font-weight="700" fill="#0F172A">AI 執行服務 Agent Runtime</text>
  <g fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1">
    <rect x="386" y="838" width="278" height="40" rx="5"/>
    <rect x="386" y="886" width="278" height="40" rx="5"/>
    <rect x="386" y="934" width="278" height="40" rx="5"/>
  </g>
  <g font-size="13" font-weight="700" fill="#0F172A">
    <text x="396" y="854">受控協調器＋確定性安全評估</text>
    <text x="396" y="902">模型轉接介面</text>
    <text x="396" y="950">事件／記憶候選提案＋RAG 檢索</text>
  </g>
  <g font-size="11.5" fill="#475569">
    <text x="396" y="870">單輪決策、步數上限；LLM 不取代安全閘</text>
    <text x="396" y="918">Gemini 已驗證；Bedrock／OpenAI 相容可替換</text>
    <text x="396" y="966">只提案；RAG 唯讀並過濾來源・版本・覆核狀態</text>
  </g>
  <text x="386" y="996" font-size="11" fill="#64748B">只回傳提案；由 Core 重驗後才寫入</text>
  <text x="664" y="996" font-size="11" fill="#64748B" text-anchor="end">Python／FastAPI</text>

  <!-- ===== F. 外部供應商 ===== -->
  <g stroke="#334155" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ae)">
    <line x1="85"  y1="1010" x2="85"  y2="1046"/>
    <line x1="190" y1="1010" x2="190" y2="1046"/>
    <line x1="300" y1="1010" x2="300" y2="1046"/>
  </g>
  <line x1="525" y1="1010" x2="525" y2="1046" stroke="#334155" stroke-width="1.5" marker-end="url(#ae)"/>

  <g fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2">
    <rect x="40"  y="1046" width="90"  height="48" rx="6"/>
    <rect x="140" y="1046" width="100" height="48" rx="6"/>
    <rect x="250" y="1046" width="100" height="48" rx="6"/>
    <rect x="460" y="1046" width="130" height="48" rx="6"/>
  </g>
  <g font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">
    <text x="85"  y="1066">Deepgram</text>
    <text x="190" y="1066">Azure Speech</text>
    <text x="300" y="1066">SageMaker</text>
    <text x="525" y="1066">Google Gemini</text>
  </g>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="85"  y="1084">ASR 華／英</text>
    <text x="190" y="1084">TTS 華／英</text>
    <text x="300" y="1084">台／客 ASR／TTS</text>
    <text x="525" y="1084">陪伴回覆生成</text>
  </g>

  <!-- ===== 側邊路徑 ===== -->
  <!-- PWA → Speech：音訊上傳（左側） -->
  <path d="M40,240 H16 V906 H40" fill="none" stroke="#334155" stroke-width="1.5" marker-start="url(#as)" marker-end="url(#ae)"/>
  <text x="11" y="575" font-size="12" fill="#334155" text-anchor="middle" transform="rotate(-90 11 575)">音訊上傳（受 Voice Ticket 保護）／回覆語音</text>
  <!-- Core → LINE：通知（右側，規劃） -->
  <path d="M680,352 H698 V64 H680" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#aem)"/>
  <text x="708" y="210" font-size="12" fill="#64748B" text-anchor="middle" transform="rotate(90 708 210)">最小通知＋安全連結（規劃）</text>

  <!-- ===== 圖例 ===== -->
  <g font-size="12" fill="#334155">
    <line x1="40" y1="1118" x2="70" y2="1118" stroke="#334155" stroke-width="1.5"/>
    <text x="76" y="1122">已實作並本機驗證</text>
    <line x1="196" y1="1118" x2="226" y2="1118" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="232" y="1122">規劃／待整合／待驗收</text>
    <rect x="376" y="1111" width="22" height="14" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <text x="404" y="1122">人工確認與授權閘門</text>
    <rect x="536" y="1111" width="22" height="14" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="564" y="1122">正式狀態唯一權威</text>
  </g>
  <text x="680" y="1142" font-size="10.5" fill="#94A3B8" text-anchor="end">截至 2026-09-16；本機開發／展示環境，非正式營運部署</text>
</svg>
