asyncapi: 3.0.0
info:
  title: kinsun.ai Core Domain Events
  version: 1.0.0
  description: |
    Provider-neutral contract produced by the implemented transactional outbox
    relay and accepted by the implemented idempotent consumer foundation. The
    failure contract defines retry versus terminal dead-letter disposition,
    but does not provide an AWS transport binding. EventBridge, per-consumer
    SQS queues, DLQs, redrive and deployment bindings remain pending the
    platform decisions listed in AGENTS.md.
defaultContentType: application/json
channels:
  coreDomainEvents:
    address: kinsun.core-domain-events
    messages:
      domainEvent:
        $ref: "#/components/messages/DomainEventV1"
operations:
  publishCoreDomainEvent:
    action: send
    channel:
      $ref: "#/channels/coreDomainEvents"
    messages:
      - $ref: "#/channels/coreDomainEvents/messages/domainEvent"
    x-kinsun-failure-contract:
      $ref: "#/components/schemas/EventDeliveryFailureV1"
  consumeCoreDomainEvent:
    action: receive
    channel:
      $ref: "#/channels/coreDomainEvents"
    messages:
      - $ref: "#/channels/coreDomainEvents/messages/domainEvent"
    x-kinsun-failure-contract:
      $ref: "#/components/schemas/EventDeliveryFailureV1"
components:
  messages:
    ElderEnrollmentChangedV1:
      name: ElderEnrollmentChangedV1
      title: Enrollment lifecycle changed
      payload:
        $ref: "../schemas/events/ElderEnrollmentChangedV1.json"
    ElderProfileChangedV1:
      name: ElderProfileChangedV1
      title: Staff elder profile changed; identifiers and versions only
      payload:
        $ref: "../schemas/events/ElderProfileChangedV1.json"
    StaffInvitationChangedV1:
      name: StaffInvitationChangedV1
      title: Development workforce invitation issued, accepted or revoked
      payload:
        $ref: "../schemas/events/StaffInvitationChangedV1.json"
    ServiceRecordCompletedV1:
      name: ServiceRecordCompletedV1
      title: Formal professional service record completed (not assignment completion)
      payload:
        $ref: "../schemas/events/ServiceRecordCompletedV1.json"
    DomainEventV1:
      name: DomainEventV1
      title: Core domain event
      payload:
        $ref: "../schemas/events/DomainEventEnvelopeV1.json"
  schemas:
    EventDeliveryFailureV1:
      $ref: "../schemas/events/EventDeliveryFailureV1.json"
