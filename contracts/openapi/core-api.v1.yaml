        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "ks1_ opaque session",
        "description": "Versioned ks1_ Core App Session. Core resolves the session, actor, tenant and role from live database state on each request. Development fake auth requires the explicit FAKE_AUTH_ENABLED flag."
      },
      "lineSignature": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Line-Signature",
        "description": "Base64 HMAC-SHA256 over the unmodified request body using the LINE Channel secret. It is not a bearer credential."
      },
      "kinsunBffAuth": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Kinsun-BFF-Authorization",
        "description": "Private BFF-to-Core Authorization header containing Bearer plus the dedicated Kinsun handoff secret. It is not a browser App Session and must never be logged or exposed to clients."
      }
