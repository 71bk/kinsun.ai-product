{
  "openapi": "3.1.0",
  "info": {
    "title": "kinsun.ai Core API",
    "version": "1.5.0",
    "summary": "Implemented Core Domain, Kinsun authentication, LINE linking, consent, security and outbox APIs.",
    "description": "Current executable Core API contract. Every protected operation re-evaluates tenant, elder, relationship or assignment scope. Core-owned opaque App Sessions authenticate browser actors after Kinsun email/password or direct Google/LINE OIDC. LINE webhooks require a raw-body HMAC signature; Core stores keyed identity digests and, only for scheduled push, an authenticated encrypted destination."
  },
  "paths": {
    "/health": {
      "get": {
        "tags": [
          "operations"
        ],
        "operationId": "getHealth",
        "summary": "Process liveness",
        "description": "Returns 200 for as long as the process is alive. Touches no database\nand requires no authentication, so it stays meaningful when the\ndatabase is down — use `/ready` to gate traffic instead.\n",
        "security": [],
        "responses": {
          "200": {
            "description": "Process is alive.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "status",
                    "uptime_seconds"
                  ],
                  "properties": {
                    "status": {
                      "type": "string",
                      "const": "ok"
                    },
                    "uptime_seconds": {
                      "type": "integer",
                      "minimum": 0,
                      "description": "Whole seconds since process start."
                    }
                  }
                },
                "example": {
                  "status": "ok",
                  "uptime_seconds": 137
                }
              }
            }
          }
        }
      }
    },
    "/ready": {
      "get": {
        "tags": [
          "operations"
        ],
        "operationId": "getReady",
        "summary": "Readiness including database connectivity",
        "description": "Verifies the database answers `SELECT 1` within 3 seconds. Returns 503\non failure or timeout, so an orchestrator removes the instance from\nrotation rather than sending it traffic it cannot serve.\n",
        "security": [],
        "responses": {
          "200": {
            "description": "Database reachable.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "status",
                    "database"
                  ],
                  "properties": {
                    "status": {
                      "type": "string",
                      "const": "ready"
                    },
                    "database": {
                      "type": "string",
                      "const": "connected"
                    }
                  }
                },
                "example": {
                  "status": "ready",
                  "database": "connected"
                }
              }
            }
          },
          "503": {
            "description": "Database unreachable or slower than the 3 second budget.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "status",
                    "database"
                  ],
                  "properties": {
                    "status": {
                      "type": "string",
                      "const": "not_ready"
                    },
                    "database": {
                      "type": "string",
                      "const": "unavailable"
                    }
                  }
                },
                "example": {
                  "status": "not_ready",
                  "database": "unavailable"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/webhooks/line": {
      "post": {
        "tags": [
          "line"
        ],
        "summary": "Receive Line Webhook",
        "description": "Validates the raw-body LINE signature, deduplicates durable domain processing by webhookEventId, and consumes reply tokens at most once only after the corresponding event transaction commits.",
        "operationId": "receive_line_webhook_api_v1_webhooks_line_post",
        "parameters": [
          {
            "name": "X-Line-Signature",
            "in": "header",
            "required": true,
            "schema": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ],
              "title": "X-Line-Signature"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": {
                    "type": "boolean"
                  },
                  "title": "Response Receive Line Webhook Api V1 Webhooks Line Post"
                }
              }
            }
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "400": {
            "description": "The JSON body or webhook event collection is invalid.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/common/ErrorEnvelopeV1.json"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFoundOrForbidden"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "503": {
            "$ref": "#/components/responses/Unavailable"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": true,
                "required": [
                  "events"
                ],
                "properties": {
                  "events": {
                    "type": "array",
                    "items": {
                      "type": "object"
                    }
                  }
                }
              }
            }
          }
        },
        "security": [
          {
            "lineSignature": []
          }
        ]
      }
    },
