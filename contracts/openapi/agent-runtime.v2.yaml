openapi: 3.1.0

info:
  title: kinsun.ai Agent Runtime
  version: "2.0.0"
  summary: Governed staging RAG retrieval for the smart eldercare AI companion system.
  description: |
    V2 preserves the V1 retrieval endpoint while adding a complete governed
    citation response. Every successful result carries source lineage,
    human-review state, a verifiable locator, and public source URLs. Internal
    storage URLs and artifact paths are outside the wire contract.

    The endpoint is private and staging-only. `needs_review` evidence may be
    returned only when the server operator explicitly enables the staging
    override; it always remains `production_approved: false`. Missing or
    incomplete citation metadata fails the complete result batch closed.
    This contract does not authorize production use, indexing, or deployment.

servers:
  - url: http://localhost:8001
    description: Local development (uvicorn --app-dir src agent_runtime.app:app)

tags:
  - name: rag
    description: Fail-closed governed retrieval from the staging knowledge index.

paths:
  /api/v2/rag/retrievals:
    post:
      tags: [rag]
      operationId: retrieveGovernedKnowledge
      summary: Retrieve governed chunks with complete citations
      description: |
        Returns three to five governed results only when every selected result
        satisfies the fixed retrieval policy and the complete V2 citation
        contract. Any incomplete citation makes the response `NO_DATA` with no
        partial results. Provider failure returns `FAILED` with no provider
        details or rejected query text.
      parameters:
        - $ref: "#/components/parameters/ServiceCorrelationId"
      security:
        - Gate1ServiceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrievalRequestV2"
      responses:
        "200":
          description: Retrieval succeeded, found no complete evidence, or failed closed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/RetrievalResponseV2"
                  meta:
                    $ref: "#/components/schemas/ResponseMetaV1"
        "401":
          $ref: "#/components/responses/ServiceUnauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    Gate1ServiceCredential:
      type: apiKey
      in: header
      name: X-Kinsun-Service-Credential
      description: Request-bound private service credential; never a browser token.

  parameters:
    ServiceCorrelationId:
      name: x-correlation-id
      in: header
      required: true
      description: Correlation ID covered by the signed service credential.
      schema:
        type: string

  responses:
    ServiceUnauthorized:
      description: Missing, invalid, expired, replayed, or request-mismatched service identity.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelopeV1"
    ValidationFailed:
      description: The request body failed closed schema validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelopeV1"
    InternalError:
      description: Unexpected server-side failure with a sanitized public message.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelopeV1"

  schemas:
    ResponseMetaV1:
      $ref: "../schemas/common/ResponseMetaV1.json"
    ErrorEnvelopeV1:
      $ref: "../schemas/common/ErrorEnvelopeV1.json"
    RetrievalRequestV2:
      $ref: "../schemas/rag/retrieval-request-v2.schema.json"
    RetrievalResponseV2:
      $ref: "../schemas/rag/retrieval-response-v2.schema.json"
