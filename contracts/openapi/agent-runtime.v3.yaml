openapi: 3.1.0

info:
  title: kinsun.ai Agent Runtime
  version: "3.0.0"
  summary: Governed staging RAG retrieval for the smart eldercare AI companion system.
  description: |
    V3 is an additional private natural-question endpoint; V1/V2 remain unchanged. It adds a grounded
    citation response. Every successful result carries source lineage,
    human-review state, a verifiable locator, and public source URLs. Internal
    storage URLs and artifact paths are outside the wire contract.

    The endpoint remains private. Source review state is preserved and is not a manual
    admission requirement. Source currency is exposed as current or unknown; superseded
    evidence is excluded. Disabled or unconfigured V3 returns FAILED. Public clients cannot
    supply evidence, policy, or support sets. This contract does not authorize deployment.

servers:
  - url: http://localhost:8001
    description: Local development (uvicorn --app-dir src agent_runtime.app:app)

tags:
  - name: rag
    description: Fail-closed governed retrieval from the staging knowledge index.

paths:
  /api/v3/rag/retrievals:
    post:
      tags: [rag]
      operationId: retrieveEvidenceGatedKnowledge
      summary: Retrieve governed chunks with complete citations
      description: |
        Returns one to five cited sources for SUFFICIENT or PARTIAL answers to natural questions.
        PARTIAL answers identify missing facets. Success includes release, embedding profile,
        and policy version bindings. Model citation IDs and support quotations are checked
        against retrieved evidence. Insufficient evidence returns NO_DATA; provider failures
        return FAILED without provider details or rejected query text.
      parameters:
        - $ref: "#/components/parameters/ServiceCorrelationId"
      security:
        - Gate1ServiceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrievalRequestV3"
      responses:
        "200":
          description: Retrieval succeeded, found no complete evidence, or failed closed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/RetrievalResponseV3"
                  meta:
                    $ref: "#/components/schemas/ResponseMetaV1"
        "401":
          $ref: "#/components/responses/ServiceUnauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    Gate1ServiceCredential:
      type: apiKey
      in: header
      name: X-Kinsun-Service-Credential
      description: Request-bound private service credential; never a browser token.

  parameters:
    ServiceCorrelationId:
      name: x-correlation-id
      in: header
      required: true
      description: Correlation ID covered by the signed service credential.
      schema:
        type: string

  responses:
    ServiceUnauthorized:
      description: Missing, invalid, expired, replayed, or request-mismatched service identity.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelopeV1"
    ValidationFailed:
      description: The request body failed closed schema validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelopeV1"
    InternalError:
      description: Unexpected server-side failure with a sanitized public message.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelopeV1"

  schemas:
    ResponseMetaV1:
      $ref: "../schemas/common/ResponseMetaV1.json"
    ErrorEnvelopeV1:
      $ref: "../schemas/common/ErrorEnvelopeV1.json"
    RetrievalRequestV3:
      $ref: "../schemas/rag/retrieval-request-v3.schema.json"
    RetrievalResponseV3:
      $ref: "../schemas/rag/retrieval-response-v3.schema.json"
